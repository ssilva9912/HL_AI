name: homelab-ai

x-app-environment: &app-environment
  HOMELAB_DATABASE_URL: >-
    postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  HOMELAB_OLLAMA_URL: ${HOMELAB_OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
  HOMELAB_LLM_MODEL: ${HOMELAB_LLM_MODEL:-llama3.1:8b}
  HOMELAB_EMBEDDING_MODEL: ${HOMELAB_EMBEDDING_MODEL:-nomic-embed-text}
  HOMELAB_REQUEST_TIMEOUT: ${HOMELAB_REQUEST_TIMEOUT:-120}
  HOMELAB_EMBEDDING_TIMEOUT: ${HOMELAB_EMBEDDING_TIMEOUT:-30}
  HOMELAB_DEFAULT_TOP_K: ${HOMELAB_DEFAULT_TOP_K:-5}
  HOMELAB_CONVERSATION_MEMORY_MESSAGES: ${HOMELAB_CONVERSATION_MEMORY_MESSAGES:-12}
  HOMELAB_CONVERSATION_MEMORY_CHARS: ${HOMELAB_CONVERSATION_MEMORY_CHARS:-4000}
  HOMELAB_HYBRID_RELEVANCE_THRESHOLD: ${HOMELAB_HYBRID_RELEVANCE_THRESHOLD:-0.0}
  HOMELAB_DOCUMENT_DIRECTORY: /app/data/documents
  HOMELAB_STAGING_DIRECTORY: /app/data/staging
  HOMELAB_VECTOR_STORE_PATH: /app/data/index/qdrant
  HOMELAB_OLLAMA_KEEP_ALIVE: ${HOMELAB_OLLAMA_KEEP_ALIVE:-30m}
  HOMELAB_OLLAMA_NUM_PREDICT: ${HOMELAB_OLLAMA_NUM_PREDICT:-1024}
  HOMELAB_WEB_SEARCH_URL: ${HOMELAB_WEB_SEARCH_URL-http://searxng:8080}
  HOMELAB_WEB_MAX_RESULTS: ${HOMELAB_WEB_MAX_RESULTS:-4}
  HOMELAB_WEB_FETCH_TIMEOUT: ${HOMELAB_WEB_FETCH_TIMEOUT:-8}
  HOMELAB_WEB_MAX_PAGE_BYTES: ${HOMELAB_WEB_MAX_PAGE_BYTES:-1000000}
  HOMELAB_CRAG_ENABLED: ${HOMELAB_CRAG_ENABLED:-true}
  HOMELAB_CRAG_CORRECT_THRESHOLD: ${HOMELAB_CRAG_CORRECT_THRESHOLD:-2.0}
  HOMELAB_CRAG_INCORRECT_THRESHOLD: ${HOMELAB_CRAG_INCORRECT_THRESHOLD:--6.0}
  HOMELAB_CRAG_STRIP_THRESHOLD: ${HOMELAB_CRAG_STRIP_THRESHOLD:--4.0}
  HOMELAB_CRAG_QUERY_REWRITE: ${HOMELAB_CRAG_QUERY_REWRITE:-true}
  HOMELAB_WARMUP_ON_STARTUP: ${HOMELAB_WARMUP_ON_STARTUP:-true}
  HOMELAB_QUERY_CACHE_SIZE: ${HOMELAB_QUERY_CACHE_SIZE:-256}
  HOMELAB_QUERY_CACHE_TTL_SECONDS: ${HOMELAB_QUERY_CACHE_TTL_SECONDS:-900}
  HOMELAB_LOG_FORMAT: ${HOMELAB_LOG_FORMAT:-text}
  HOMELAB_METRICS_ENABLED: ${HOMELAB_METRICS_ENABLED:-true}
  HOMELAB_NETWORK_SHARE_NAME: ${HOMELAB_NETWORK_SHARE_NAME:-Local document share}
  HOMELAB_NETWORK_SHARE_DIRECTORY: /mnt/network-share

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/bin/sh", "/app/docker/api-entrypoint.sh"]
    environment:
      <<: *app-environment
      HOMELAB_API_HOST: 0.0.0.0
      HOMELAB_API_PORT: 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${HOMELAB_API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
      - model_cache:/home/homelab/.cache
      - ${HOMELAB_NETWORK_SHARE_HOST_PATH:-./data/network-share}:/mnt/network-share:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "streamlit",
        "run",
        "frontend/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    environment:
      HOMELAB_API_URL: http://api:8000
      HOMELAB_REQUEST_TIMEOUT: ${HOMELAB_REQUEST_TIMEOUT:-120}
      HOMELAB_DEFAULT_TOP_K: ${HOMELAB_DEFAULT_TOP_K:-5}
    ports:
      - "127.0.0.1:${HOMELAB_FRONTEND_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HOMELAB_PROXY_PORT:-80}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      frontend:
        condition: service_started

  # Optional web search backend: docker compose --profile web up -d
  searxng:
    image: searxng/searxng:2026.10.25-54ca1d9cf
    profiles: ["web"]
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-homelab-local-only-change-me}
    ports:
      - "127.0.0.1:${HOMELAB_SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

  # Optional metrics stack: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${HOMELAB_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/homelab-ai.json
    ports:
      - "127.0.0.1:${HOMELAB_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  app_data:
  model_cache:
  caddy_data:
  prometheus_data:
  grafana_data:
